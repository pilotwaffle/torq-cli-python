name: credential-evidence

# Weekly and on-demand credential-evidence runs using the repo's own shipped
# wheel.
#
# Discipline (release trust pack R0A):
# - Every action reference uses a reviewed immutable full SHA (the same pins
#   reviewed for ci.yml). No floating tags, branches, or version refs.
# - Every checkout sets persist-credentials: false.
# - The evidence date is derived deterministically from the candidate commit
#   date, or supplied as a validated workflow_dispatch input. No hardcoded
#   calendar dates.
# - The build job records a wheel manifest (source SHA, workflow blob SHA,
#   artifact SHA-256, platform, Python version, evidence-schema version);
#   evidence jobs verify that manifest against their own run context before
#   installing anything, so an artifact from one job/run cannot be substituted
#   into another.
# - Wheel hash verification remains mandatory before installation.
# - This workflow is evidence collection only. It is NOT a release publisher.

on:
  schedule:
    # Every Monday at 03:20 UTC.
    - cron: "20 3 * * 1"
  workflow_dispatch:
    inputs:
      evidence_date:
        description: "Optional ISO-8601 evidence date (YYYY-MM-DD). Defaults to the candidate commit date."
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m build --wheel
      - name: Record wheel manifest (provenance inputs)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          wheel="$(ls torq_cli-*.whl)"
          sha256sum "$wheel" > wheel.sha256
          export WHEEL_SHA256="$(awk '{print toupper($1)}' wheel.sha256)"
          export WORKFLOW_BLOB_SHA="$(git rev-parse HEAD:.github/workflows/credential-evidence.yml)"
          python - <<'PY'
          import json, os

          manifest = {
              "evidence_schema_version": "1.0.0",
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_blob_sha": os.environ["WORKFLOW_BLOB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "artifact_name": "torq-cli-wheel",
              "platform": "ubuntu-latest",
              "python_version": "3.11",
              "wheel_sha256": os.environ["WHEEL_SHA256"],
          }
          with open("wheel-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: torq-cli-wheel
          path: |
            dist/torq_cli-*.whl
            dist/wheel.sha256
            dist/wheel-manifest.json
          if-no-files-found: error
      # Canonical name for the action historically referenced as
      # actions/artifact-attestations (repository was renamed).
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/torq_cli-*.whl
          push-to-registry: true

  native-macos:
    needs: build-wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - name: Derive evidence date
        id: evidence_date
        shell: bash
        run: |
          set -euo pipefail
          supplied="${{ inputs.evidence_date }}"
          if [ -n "$supplied" ]; then
            printf '%s' "$supplied" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
              || { echo "invalid evidence_date: $supplied" >&2; exit 1; }
            today="$(date -u +%Y-%m-%d)"
            if [ "$supplied" \> "$today" ]; then
              echo "future evidence_date rejected: $supplied" >&2
              exit 1
            fi
            echo "date=$supplied" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(git show -s --format=%cs '${{ github.sha }}')" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: torq-cli-wheel
          path: dist
      - name: Verify wheel manifest against this run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          manifest = json.load(open("dist/wheel-manifest.json", encoding="utf-8"))
          failures = []
          if manifest["source_sha"] != os.environ["GITHUB_SHA"]:
              failures.append("source_sha mismatch")
          if str(manifest["run_id"]) != os.environ["GITHUB_RUN_ID"]:
              failures.append("run_id mismatch")
          if manifest["artifact_name"] != "torq-cli-wheel":
              failures.append("artifact_name mismatch")
          if manifest["evidence_schema_version"] != "1.0.0":
              failures.append("evidence_schema_version mismatch")
          if failures:
              print("wheel manifest substitution guard failed:", failures, file=sys.stderr)
              sys.exit(1)
          PY
      - name: Verify and install exact wheel
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c wheel.sha256
          wheel="$(ls torq_cli-*.whl)"
          wheel_hash="$(awk '{print toupper($1)}' wheel.sha256)"
          # Ensure keyring sees a fresh, non-interactive session keychain.
          security -v create-keychain -p ci "$RUNNER_TEMP/torq-evidence.keychain-db"
          security -v default-keychain -s "$RUNNER_TEMP/torq-evidence.keychain-db"
          security -v unlock-keychain -p ci "$RUNNER_TEMP/torq-evidence.keychain-db"
          security -v set-keychain-settings -t 3600 -l "$RUNNER_TEMP/torq-evidence.keychain-db"
          # Keep the GUI prompt observer-only; CI answers the authorization dialog.
          export TORQ_GUI_ALLOW=1
          python -m venv "$RUNNER_TEMP/evidence-venv"
          "$RUNNER_TEMP/evidence-venv/bin/python" -m pip install --disable-pip-version-check "$wheel"
          mkdir -p "$RUNNER_TEMP/evidence"
          "$RUNNER_TEMP/evidence-venv/bin/python" scripts/run_native_credential_evidence.py \
            --expected-os Darwin --expected-backend macos_keychain \
            --wheel "$(pwd)/$wheel" --wheel-sha256 "$wheel_hash" \
            --report "$RUNNER_TEMP/evidence/macos.json" \
            --date "${{ steps.evidence_date.outputs.date }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-credential-macos
          path: ${{ runner.temp }}/evidence/macos.json
          if-no-files-found: error

  native-windows:
    needs: build-wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - name: Derive evidence date
        id: evidence_date
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $supplied = "${{ inputs.evidence_date }}"
          if ($supplied) {
            if ($supplied -notmatch '^\d{4}-\d{2}-\d{2}$') {
              throw "invalid evidence_date: $supplied"
            }
            if ([DateTime]$supplied -gt (Get-Date).ToUniversalTime().Date) {
              throw "future evidence_date rejected: $supplied"
            }
            $date = $supplied
          } else {
            $date = (git show -s --format=%cs $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) { throw "git commit-date derivation failed" }
          }
          "date=$date" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: torq-cli-wheel
          path: ${{ runner.temp }}\dist
      - name: Verify wheel manifest against this run
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content "$env:RUNNER_TEMP\dist\wheel-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:GITHUB_SHA) { throw "source_sha mismatch" }
          if ("$($manifest.run_id)" -ne $env:GITHUB_RUN_ID) { throw "run_id mismatch" }
          if ($manifest.artifact_name -ne "torq-cli-wheel") { throw "artifact_name mismatch" }
          if ($manifest.evidence_schema_version -ne "1.0.0") { throw "evidence_schema_version mismatch" }
      - name: Verify and install exact wheel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "$env:RUNNER_TEMP\dist"
          Get-Content .\wheel.sha256 | ForEach-Object {
            $hash, $name = ($_ -split '\s+', 2)
            $actual = (Get-FileHash -Algorithm SHA256 $name).Hash
            if ($actual.ToUpper() -ne $hash.ToUpper()) {
              throw "wheel hash mismatch: $name"
            }
          }
          $wheel = Get-Item .\torq_cli-*.whl | Select-Object -First 1
          $expected = (Get-FileHash -Algorithm SHA256 $wheel.Name).Hash
          python -m venv "$env:RUNNER_TEMP\evidence-venv"
          & "$env:RUNNER_TEMP\evidence-venv\Scripts\python.exe" -m pip install --disable-pip-version-check $wheel.FullName
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\evidence" | Out-Null
          $env:T35_WHEEL = $wheel.FullName
          $env:T35_WHEEL_HASH = $expected
          $env:T35_REPORT = "$env:RUNNER_TEMP\evidence\windows.json"
          $env:T35_VENV_PYTHON = "$env:RUNNER_TEMP\evidence-venv\Scripts\python.exe"
          $env:T35_DATE = "${{ steps.evidence_date.outputs.date }}"
          $pyCode = @'
          import os, subprocess, sys
          wheel = os.environ["T35_WHEEL"]
          report = os.environ["T35_REPORT"]
          wheel_hash = os.environ["T35_WHEEL_HASH"]
          venv_python = os.environ["T35_VENV_PYTHON"]
          date = os.environ["T35_DATE"]

          def run(command):
              completed = subprocess.run(command, capture_output=True, text=True)
              if completed.returncode != 0:
                  raise SystemExit(
                      "command failed: "
                      + " ".join(command)
                      + "\nstdout:\n"
                      + completed.stdout
                      + "\nstderr:\n"
                      + completed.stderr
                  )

          def read_text(path):
              with open(path, "r", encoding="utf-8") as handle:
                  return handle.read()

          def run_evidence():
              run(
                  [
                      venv_python,
                      "scripts/run_native_credential_evidence.py",
                      "--expected-os",
                      "Windows",
                      "--expected-backend",
                      "windows_credential_manager",
                      "--wheel",
                      wheel,
                      "--wheel-sha256",
                      wheel_hash,
                      "--report",
                      report,
                      "--date",
                      date,
                  ]
              )

          def prompt_approved():
              try:
                  return int(read_text(r"C:\torq-t35-consent.txt").strip()) == 1
              except Exception:
                  return False

          def prompt_denied():
              try:
                  return int(read_text(r"C:\torq-t35-consent.txt").strip()) == 0
              except Exception:
                  return False

          def click_once(window_title_part, button_text):
              script = f'''
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class T35Win32 {{
              [DllImport("user32.dll")] public static extern IntPtr FindWindow(string lpClassName, string lpWindowName);
              [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }}
          "@
          $target = Get-Process | Where-Object {{ $_.MainWindowTitle -like "*{window_title_part}*" }} | Select-Object -First 1
          if (-not $target) {{ exit 1 }}
          [T35Win32]::SetForegroundWindow($target.MainWindowHandle) | Out-Null
          Start-Sleep -Milliseconds 700
          $button = $target.MainWindowHandle
          foreach ($control in $target.MainWindow.Controls) {{
              if ($control.Text -eq "{button_text}") {{ $button = $control.Handle; break }}
          }}
          [T35Win32]::SendMessage($button, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
          '''
              run(["powershell", "-NoProfile", "-Command", script])

          run_evidence()
          if prompt_approved():
              click_once("Windows Security", "Allow access")
              if not prompt_approved():
                  raise SystemExit("expected approved consent after clicking Allow access")
              run_evidence()
              if prompt_denied():
                  raise SystemExit("unexpected denied consent after clicking Allow access")
          elif prompt_denied():
              raise SystemExit("expected approved consent, found denied consent before interaction")
          else:
              raise SystemExit("expected approved consent before interaction")
          '
          python -c $pyCode
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-credential-windows
          path: ${{ runner.temp }}\evidence\windows.json
          if-no-files-found: error

  native-linux:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - name: Derive evidence date
        id: evidence_date
        shell: bash
        run: |
          set -euo pipefail
          supplied="${{ inputs.evidence_date }}"
          if [ -n "$supplied" ]; then
            printf '%s' "$supplied" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
              || { echo "invalid evidence_date: $supplied" >&2; exit 1; }
            today="$(date -u +%Y-%m-%d)"
            if [ "$supplied" \> "$today" ]; then
              echo "future evidence_date rejected: $supplied" >&2
              exit 1
            fi
            echo "date=$supplied" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(git show -s --format=%cs '${{ github.sha }}')" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: torq-cli-wheel
          path: ${{ runner.temp }}/dist
      - name: Verify wheel manifest against this run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          manifest = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "dist", "wheel-manifest.json"), encoding="utf-8"))
          failures = []
          if manifest["source_sha"] != os.environ["GITHUB_SHA"]:
              failures.append("source_sha mismatch")
          if str(manifest["run_id"]) != os.environ["GITHUB_RUN_ID"]:
              failures.append("run_id mismatch")
          if manifest["artifact_name"] != "torq-cli-wheel":
              failures.append("artifact_name mismatch")
          if manifest["evidence_schema_version"] != "1.0.0":
              failures.append("evidence_schema_version mismatch")
          if failures:
              print("wheel manifest substitution guard failed:", failures, file=sys.stderr)
              sys.exit(1)
          PY
      - name: Install Secret Service runtime
        shell: bash
        run: |
          retry_apt() {
            for attempt in 1 2 3; do
              if sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout 90 \
                apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            return 1
          }
          retry_apt update -qq
          retry_apt install -y -qq --no-install-recommends dbus-x11 gnome-keyring
      - name: Verify and install exact wheel
        shell: bash
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum -c wheel.sha256
          python -m venv "$RUNNER_TEMP/torq-evidence-venv"
          "$RUNNER_TEMP/torq-evidence-venv/bin/python" -m pip install --disable-pip-version-check ./*.whl
      - name: Exercise isolated Linux Secret Service
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/dist" -name '*.whl' -type f -print -quit)"
          wheel_hash="$(awk '{print toupper($1)}' "$RUNNER_TEMP/dist/wheel.sha256")"
          export TORQ_T35_WHEEL="$wheel"
          export TORQ_T35_WHEEL_HASH="$wheel_hash"
          export TORQ_T35_REPORT="$RUNNER_TEMP/evidence/linux.json"
          export TORQ_T35_VENV="$RUNNER_TEMP/torq-evidence-venv"
          export TORQ_T35_DATE="${{ steps.evidence_date.outputs.date }}"
          dbus-run-session -- bash -euo pipefail -c '
            export DISPLAY=:99
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/torq-t35-runtime"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            password="$(python -c "import secrets; print(secrets.token_urlsafe(24))")"
            eval "$(printf "%s\n" "$password" | gnome-keyring-daemon --unlock --components=secrets)"
            GNOME_KEYRING_CONTROL="$XDG_RUNTIME_DIR/keyring" \
            SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/keyring/ssh" \
            TORQ_HEADLESS=1 \
            "$TORQ_T35_VENV/bin/python" scripts/run_native_credential_evidence.py \
              --expected-os Linux --expected-backend secret_service \
              --wheel "$TORQ_T35_WHEEL" --wheel-sha256 "$TORQ_T35_WHEEL_HASH" \
              --report "$TORQ_T35_REPORT" --date "$TORQ_T35_DATE"
          '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-credential-linux
          path: ${{ runner.temp }}/evidence/linux.json
          if-no-files-found: error
