name: native-credential-evidence

on:
  workflow_dispatch:
  push:
    branches: [feat/t35-clean-machine-credentials]
    paths-ignore:
      - docs/evidence/**
      - docs/prd-implementation-status-2026-07-23.md
      - docs/architecture/phase1-status.md

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install build==1.5.0
      - run: python -m build --wheel
      - name: Record artifact hash
        shell: bash
        run: cd dist && sha256sum *.whl > wheel.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: torq-cli-wheel
          path: |
            dist/*.whl
            dist/wheel.sha256
          if-no-files-found: error

  native-macos:
    needs: build-wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v6
        with:
          name: torq-cli-wheel
          path: ${{ runner.temp }}/dist
      - name: Verify and install exact wheel
        shell: bash
        run: |
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 -c wheel.sha256
          python -m venv "$RUNNER_TEMP/torq-evidence-venv"
          "$RUNNER_TEMP/torq-evidence-venv/bin/python" -m pip install --disable-pip-version-check ./*.whl
      - name: Exercise isolated macOS Keychain
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/torq-t35.keychain-db"
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          wheel="$(find "$RUNNER_TEMP/dist" -name '*.whl' -type f -print -quit)"
          wheel_hash="$(awk '{print toupper($1)}' "$RUNNER_TEMP/dist/wheel.sha256")"
          "$RUNNER_TEMP/torq-evidence-venv/bin/python" scripts/run_native_credential_evidence.py \
            --expected-os macOS --expected-backend macos_keychain \
            --wheel "$wheel" --wheel-sha256 "$wheel_hash" \
            --report "$RUNNER_TEMP/evidence/macos.json" --date 2026-07-24
      - uses: actions/upload-artifact@v6
        with:
          name: native-credential-macos
          path: ${{ runner.temp }}/evidence/macos.json
          if-no-files-found: error

  native-linux:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v6
        with:
          name: torq-cli-wheel
          path: ${{ runner.temp }}/dist
      - name: Install Secret Service runtime
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Verify and install exact wheel
        shell: bash
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum -c wheel.sha256
          python -m venv "$RUNNER_TEMP/torq-evidence-venv"
          "$RUNNER_TEMP/torq-evidence-venv/bin/python" -m pip install --disable-pip-version-check ./*.whl
      - name: Exercise isolated Linux Secret Service
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/dist" -name '*.whl' -type f -print -quit)"
          wheel_hash="$(awk '{print toupper($1)}' "$RUNNER_TEMP/dist/wheel.sha256")"
          export TORQ_T35_WHEEL="$wheel"
          export TORQ_T35_WHEEL_HASH="$wheel_hash"
          export TORQ_T35_REPORT="$RUNNER_TEMP/evidence/linux.json"
          export TORQ_T35_VENV="$RUNNER_TEMP/torq-evidence-venv"
          dbus-run-session -- bash -euo pipefail -c '
            export DISPLAY=:99
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/torq-t35-runtime"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            password="$(python -c "import secrets; print(secrets.token_urlsafe(24))")"
            eval "$(printf "%s\n" "$password" | gnome-keyring-daemon --unlock --components=secrets)"
            "$TORQ_T35_VENV/bin/python" scripts/run_native_credential_evidence.py \
              --expected-os Linux --expected-backend secret_service \
              --wheel "$TORQ_T35_WHEEL" --wheel-sha256 "$TORQ_T35_WHEEL_HASH" \
              --report "$TORQ_T35_REPORT" --date 2026-07-24
          '
      - uses: actions/upload-artifact@v6
        with:
          name: native-credential-linux
          path: ${{ runner.temp }}/evidence/linux.json
          if-no-files-found: error
