name: quality

env:
  TORQ_TEST_NETWORK_MODE: deny

on:
  push:
  pull_request:

jobs:
  linux-systemd-experimental-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - name: Run experimental user-systemd kernel behavior gate
        continue-on-error: true
        shell: bash
        env:
          TORQ_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          uid="$(id -u)"
          bootstrap_status=0
          if [ "$(cat /proc/1/comm 2>/dev/null || true)" != "systemd" ]; then
            bootstrap_status=1
          elif ! sudo /usr/bin/systemctl start "user-runtime-dir@${uid}.service" "user@${uid}.service"; then
            bootstrap_status=1
          fi
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          python scripts/run_linux_ownership_evidence.py \
            --bootstrap-status "$bootstrap_status" \
            --junit "$RUNNER_TEMP/linux-owned-process/junit.xml" \
            --report "$RUNNER_TEMP/linux-owned-process/evidence.json"
      - name: Upload Linux ownership evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-systemd-experimental-evidence
          path: ${{ runner.temp }}/linux-owned-process/
          if-no-files-found: error

  # Python 3.11 lanes are the security lanes: they run the full gate including
  # named mutants. The job names quality-{os}-py311 are required branch-
  # protection contexts and MUST NOT be renamed.
  quality-windows-py311:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python scripts/run_named_mutants.py
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  quality-macos-py311:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python scripts/run_named_mutants.py
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  quality-linux-py311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python scripts/run_named_mutants.py
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  # Python 3.12 and 3.13 compatibility lanes. Full ruff/mypy/pytest/build/wheel-
  # smoke on every supported version; named mutants run only on the 3.11
  # security lanes because no mutant is intentionally version-sensitive.
  quality-windows-py312:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  quality-windows-py313:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  quality-macos-py312:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  quality-macos-py313:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  quality-linux-py312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  quality-linux-py313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  headless-linux-py311:
    runs-on: ubuntu-latest
    env:
      TORQ_HEADLESS: '1'
      TORQ_CREDENTIAL_BACKEND: encrypted_file_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q tests/test_headless_fallback.py
      - run: python -m pytest -q
      - run: python scripts/run_named_mutants.py
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist

  # Report-only observability (release trust pack R0E): coverage, mutant
  # summary, dependency vulnerability scan, and link report. This job
  # informs; it does not gate. The mandatory named-mutant gate remains the
  # security lane's `python scripts/run_named_mutants.py` step, unchanged.
  report-only-metrics-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - name: Line and branch coverage (report-only, no percentage gate)
        continue-on-error: true
        run: |
          mkdir -p metrics
          python -m pytest -q --cov=torq_cli --cov-branch \
            --cov-report=term --cov-report=json:metrics/coverage.json \
            > metrics/coverage-console.txt 2>&1 || true
          cat metrics/coverage-console.txt
      - name: Named-mutant summary (report-only; mandatory gate unchanged)
        continue-on-error: true
        run: |
          mkdir -p metrics
          python scripts/run_named_mutants.py --json-summary metrics/mutant-summary.json \
            > metrics/mutant-console.txt 2>&1 || true
          cat metrics/mutant-console.txt
      - name: Dependency vulnerability scan (report-only, non-blocking)
        continue-on-error: true
        run: |
          mkdir -p metrics
          python -m pip_audit --format json --output metrics/pip-audit.json || true
          python -m pip_audit > metrics/pip-audit-console.txt 2>&1 || true
          cat metrics/pip-audit-console.txt
      - name: Markdown link report (release-scope strict, rest report-only)
        continue-on-error: true
        run: |
          mkdir -p metrics
          python scripts/check_links.py --report-all | tee metrics/link-report.txt || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-only-metrics
          path: metrics/
          if-no-files-found: error
